<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CodeAlpha Social | Modern Feed</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --danger: #ef4444;
            --danger-hover: #dc2626;
        }
        body { font-family: 'Inter', sans-serif; background-color: var(--bg-color); color: var(--text-main); margin: 0; padding: 0; }
        header { background: var(--card-bg); border-bottom: 1px solid var(--border-color); padding: 15px 0; text-align: center; position: sticky; top: 0; z-index: 100; }
        header h2 { margin: 0; color: var(--primary); font-size: 1.5rem; }
        .container { max-width: 650px; margin: 30px auto; padding: 0 15px; }
        .post-box { background: var(--card-bg); padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05); border: 1px solid var(--border-color); margin-bottom: 25px; }
        input[type="text"], textarea, input[type="file"] { width: 100%; padding: 12px; margin-bottom: 12px; border: 1px solid var(--border-color); border-radius: 8px; box-sizing: border-box; background: #fbfcfd; }
        button { background: var(--primary); color: white; border: none; padding: 10px 18px; cursor: pointer; border-radius: 8px; font-weight: 600; }
        button:hover { background: var(--primary-hover); }
        .delete-btn { background: var(--danger); padding: 6px 12px; font-size: 0.8rem; border-radius: 6px; }
        .delete-btn:hover { background: var(--danger-hover); }
        .card { background: var(--card-bg); padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05); border: 1px solid var(--border-color); margin-bottom: 20px; }
        .post-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .card p { font-size: 1rem; line-height: 1.5; color: #334155; margin-bottom: 15px; }
        .post-media { width: 100%; max-height: 400px; object-fit: cover; border-radius: 8px; margin-bottom: 15px; }
        .post-footer { border-top: 1px solid var(--border-color); padding-top: 12px; display: flex; gap: 10px; }
        .like-btn { background: #f1f5f9; color: var(--text-main); border: 1px solid var(--border-color); }
        .comment-section { margin-top: 15px; background: #f8fafc; padding: 12px; border-radius: 8px; border: 1px solid var(--border-color); }
        .comment { background: #ffffff; padding: 8px 12px; border-radius: 6px; margin-bottom: 8px; border: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; font-size: 0.9rem; }
        .comment-input-wrapper { display: flex; gap: 8px; margin-top: 10px; }
    </style>
</head>
<body>

    <header>
        <h2>🌐 CodeAlpha Social Feed</h2>
    </header>

    <div class="container">
        <!-- Create Post Card -->
        <div class="post-box">
            <h3>Create a New Post</h3>
            <input type="text" id="author" placeholder="Your Name">
            <textarea id="content" placeholder="What's happening? Share your thoughts..."></textarea>
            <label style="font-size: 0.85rem; color: var(--text-muted); display: block; margin-bottom: 5px;">Attach Photo or Video:</label>
            <input type="file" id="mediaFile" accept="image/*,video/*">
            <button onclick="createPost()">Publish Post</button>
        </div>

        <div id="feed">Loading feed...</div>
    </div>

    <script>
        const API = 'http://localhost:5001/api';

        async function fetchPosts() {
            try {
                const res = await fetch(`${API}/posts`);
                const posts = await res.json();
                const feed = document.getElementById('feed');
                feed.innerHTML = '';
                
                if (posts.length === 0) {
                    feed.innerHTML = '<p style="text-align: center; color: var(--text-muted);">No posts yet. Be the first to share something!</p>';
                    return;
                }

                posts.forEach(post => {
                    let mediaHTML = '';
                    if (post.mediaUrl) {
                        if (post.mediaType === 'video') {
                            mediaHTML = `<video src="${post.mediaUrl}" controls class="post-media"></video>`;
                        } else {
                            mediaHTML = `<img src="${post.mediaUrl}" alt="Post media" class="post-media">`;
                        }
                    }

                    let commentsHTML = post.comments.map(c => `
                        <div class="comment">
                            <span>${c.text}</span>
                            <button onclick="deleteComment('${post._id}', '${c._id}')" class="delete-btn" style="padding: 2px 6px; font-size: 0.75rem;">✕</button>
                        </div>
                    `).join('');

                    feed.innerHTML += `
                        <div class="card">
                            <div class="post-header">
                                <h4>👤 ${post.author}</h4>
                                <button onclick="deletePost('${post._id}', this)" class="delete-btn">Delete</button>
                            </div>
                            <p>${post.content}</p>
                            ${mediaHTML}
                            <div class="post-footer">
                                <button onclick="likePost('${post._id}')" class="like-btn">❤️ Like (${post.likes})</button>
                            </div>
                            <div class="comment-section">
                                <h5>Comments (${post.comments.length})</h5>
                                ${commentsHTML}
                                <div class="comment-input-wrapper">
                                    <input type="text" id="comment-${post._id}" placeholder="Write a comment...">
                                    <button onclick="addComment('${post._id}')" style="padding: 8px 14px;">Reply</button>
                                </div>
                            </div>
                        </div>
                    `;
                });
            } catch (err) {
                console.error("Failed to load posts:", err);
            }
        }

        async function createPost() {
            const author = document.getElementById('author').value.trim();
            const content = document.getElementById('content').value.trim();
            const mediaFile = document.getElementById('mediaFile').files[0];

            if (!author || !content) {
                alert('Please fill in both your name and post content.');
                return;
            }

            const formData = new FormData();
            formData.append('author', author);
            formData.append('content', content);
            if (mediaFile) {
                formData.append('mediaFile', mediaFile);
            }

            await fetch(`${API}/posts`, {
                method: 'POST',
                body: formData
            });

            document.getElementById('author').value = '';
            document.getElementById('content').value = '';
            document.getElementById('mediaFile').value = '';
            fetchPosts();
        }

        async function likePost(id) {
            await fetch(`${API}/posts/${id}/like`, { method: 'POST' });
            fetchPosts();
        }

        async function addComment(id) {
            const inputField = document.getElementById(`comment-${id}`);
            const text = inputField.value.trim();
            if (!text) return;
            
            await fetch(`${API}/posts/${id}/comment`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ text })
            });
            fetchPosts();
        }

        async function deletePost(postId, buttonElement) {
            if (!confirm('Are you sure you want to delete this post?')) return;
            
            const response = await fetch(`${API}/posts/${postId}`, {
                method: 'DELETE'
            });
            
            if (response.ok) {
                const card = buttonElement.closest('.card');
                if (card) card.remove();
                else fetchPosts();
            }
        }

        async function deleteComment(postId, commentId) {
            const response = await fetch(`${API}/posts/${postId}/comment/${commentId}`, {
                method: 'DELETE'
            });
            if (response.ok) fetchPosts();
        }

        fetchPosts();
    </script>
</body>
</html>
